name: Check published tool in Chromium
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/public_browser.py'
      - '.github/workflows/browser-check.yml'
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.62.0'
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the public Pages site
        run: python tests/public_browser.py
